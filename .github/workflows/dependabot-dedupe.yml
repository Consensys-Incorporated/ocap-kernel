name: Dependabot Dedupe

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot-dedupe:
    runs-on: ubuntu-latest
    # Run this job only if it's Dependabot creating or updating the PR
    if: ${{ github.actor == 'dependabot[bot]' }}
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Configure Git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install Yarn
        run: corepack enable
      - name: Restore Yarn cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: yarn
      - run: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 yarn --immutable

      - name: Run yarn dedupe
        run: |
          yarn dedupe
          git add yarn.lock
          if git diff --staged --quiet; then
            echo "No deduplication needed"
          else
            git commit -m "chore: dedupe yarn.lock"
            git push
          fi
