name: Lint, Build, and Test

on:
  workflow_call:

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up environment
        uses: ./.github/actions/setup-environment
        with:
          node-version: ${{ matrix.node-version }}

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      matrix:
        node-version: [24.x]
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up environment
        uses: ./.github/actions/setup-environment
        with:
          node-version: ${{ matrix.node-version }}
      - run: yarn lint
      - name: Require clean working directory
        shell: bash
        run: |
          if ! git diff --exit-code; then
            echo "Working tree dirty at end of job"
            exit 1
          fi

  validate-changelog:
    name: Validate changelog
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      matrix:
        node-version: [24.x]
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up environment
        uses: ./.github/actions/setup-environment
        with:
          node-version: ${{ matrix.node-version }}
      - run: yarn changelog:validate
      - name: Require clean working directory
        shell: bash
        run: |
          if ! git diff --exit-code; then
            echo "Working tree dirty at end of job"
            exit 1
          fi

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      matrix:
        node-version: [24.x]
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up environment
        uses: ./.github/actions/setup-environment
        with:
          node-version: ${{ matrix.node-version }}
      - run: yarn build
      - name: Require clean working directory
        shell: bash
        run: |
          if ! git diff --exit-code; then
            echo "Working tree dirty at end of job"
            exit 1
          fi

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up environment
        uses: ./.github/actions/setup-environment
        with:
          node-version: ${{ matrix.node-version }}
      - uses: ./.github/actions/playwright-install
      - run: yarn build
      - run: "yarn test --coverage=${{ matrix.node-version == '24.x' && 'true' || 'false' }}"
      - name: Upload coverage artifact
        if: ${{ matrix.node-version == '24.x' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage/
          retention-days: 7
      - name: Require clean working directory
        shell: bash
        run: |
          if ! git diff --exit-code; then
            echo "Working tree dirty at end of job"
            exit 1
          fi

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [prepare]
    strategy:
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up environment
        uses: ./.github/actions/setup-environment
        with:
          node-version: ${{ matrix.node-version }}
      - run: yarn build
      - run: yarn test:integration
      - name: Require clean working directory
        shell: bash
        run: |
          if ! git diff --exit-code; then
            echo "Working tree dirty at end of job"
            exit 1
          fi

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [prepare]
    strategy:
      matrix:
        node-version: [24.x]
        package:
          [
            '@metamask/kernel-cli',
            '@metamask/kernel-node-runtime',
            '@ocap/extension',
            '@ocap/omnium-gatherum',
            '@ocap/evm-wallet-experiment',
          ]
        include:
          - package: '@metamask/kernel-cli'
            directory: kernel-cli
          - package: '@metamask/kernel-node-runtime'
            directory: kernel-node-runtime
          - package: '@ocap/extension'
            directory: extension
          - package: '@ocap/omnium-gatherum'
            directory: omnium-gatherum
          - package: '@ocap/evm-wallet-experiment'
            directory: evm-wallet-experiment
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up environment
        uses: ./.github/actions/setup-environment
        with:
          node-version: ${{ matrix.node-version }}
      - uses: ./.github/actions/playwright-install
      - run: VITE_DB_FOLDER=e2e yarn build
      - name: Run E2E tests
        id: e2e
        run: yarn workspace ${{ matrix.package }} test:e2e:ci
      - name: Upload test artifacts
        if: ${{ failure() && steps.e2e.conclusion == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-traces-${{ matrix.directory }}
          path: packages/${{ matrix.directory }}/test-results
          if-no-files-found: ignore
      - name: Require clean working directory
        shell: bash
        run: |
          if ! git diff --exit-code; then
            echo "Working tree dirty at end of job"
            exit 1
          fi
