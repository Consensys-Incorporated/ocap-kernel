name: Vat parallelism

# Times vats running at once against vats running alone. The timings depend on
# the host, so they stay out of the blocking suite and run here weekly, each
# trial on its own runner. When most trials fail, one labeled issue tracks it.

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  # A majority of the five trials in the matrix below.
  MIN_FAILURES: 3
  LABEL: vat-parallelism-regression

jobs:
  trial:
    name: Trial ${{ matrix.trial }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        trial: [1, 2, 3, 4, 5]
    steps:
      - name: Checkout and setup environment
        uses: MetaMask/action-checkout-and-setup@0543b5929698c71e3ccc6ed24eac87825669b5de # v3
        with:
          is-high-risk-environment: false
          node-version: 24.x
      - run: yarn exec turbo run build --filter=@ocap/kernel-test...
      # A failing timing is a result, not an error: the verdict job judges it.
      - run: yarn workspace @ocap/kernel-test test:perf --reporter=default --reporter=json --outputFile=perf-${{ matrix.trial }}.json
        continue-on-error: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: perf-${{ matrix.trial }}
          path: packages/kernel-test/perf-${{ matrix.trial }}.json
          retention-days: 7

  verdict:
    name: Verdict
    needs: trial
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: perf-*
          path: reports
          merge-multiple: true
      - name: Judge trials and file or update the issue
        shell: bash
        run: |
          shopt -s nullglob
          reports=(reports/*.json)
          # Too few reports and a majority can't be reached.
          if (( ${#reports[@]} < MIN_FAILURES )); then
            echo "::error::Only ${#reports[@]} trials produced a report"
            exit 1
          fi

          results=$(jq -s '
            [.[].testResults[].assertionResults[]]
            | group_by(.title)
            | map({
                title: .[0].title,
                bound: (map(.meta.bound // empty) | first),
                ratios: map(.meta.ratio // null),
                failed: map(select(.status != "passed")) | length
              })' "${reports[@]}")

          summary=$(jq -r --arg trials "${#reports[@]}" '
            .[]
            | "- **\(.title)**: failed in \(.failed) of \($trials) trials. "
              + "Ratios \(.ratios | map(if . == null then "–" else (. * 100 | round / 100 | tostring) end) | join(", ")) "
              + "against a bound of \(.bound // "?")."' <<< "$results")
          echo "$summary" >> "$GITHUB_STEP_SUMMARY"

          regressed=$(jq --argjson min "$MIN_FAILURES" 'any(.[]; .failed >= $min)' <<< "$results")
          existing=$(gh issue list --label "$LABEL" --state open --json number --jq '.[0].number // empty')

          if [[ "$regressed" != true ]]; then
            if [[ -n "$existing" ]]; then
              gh issue comment "$existing" --body "Passed on $RUN_URL

          $summary"
            fi
            exit 0
          fi

          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" --body "Still failing on $RUN_URL

          $summary"
          else
            gh label create "$LABEL" --force --color B60205 \
              --description 'Scheduled vat parallelism timings failed'
            gh issue create --label "$LABEL" \
              --title 'Vat parallelism timings failed in most trials' \
              --body "Most trials of \`packages/kernel-test/src/vat-parallelism.perf.test.ts\` failed on $RUN_URL. Later failing runs comment here instead of opening a new issue; close this once it's fixed or explained.

          $summary"
          fi
          exit 1
