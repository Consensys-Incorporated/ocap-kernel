name: Coverage Report

on:
  workflow_call:

jobs:
  report:
    name: Report
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download coverage artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage
          path: coverage/

      - name: Fetch baseline coverage from GitHub Pages
        id: baseline
        env:
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          url="https://${REPOSITORY_OWNER}.github.io/${REPOSITORY#*/}/coverage/coverage-summary.json"

          mkdir -p coverage-base
          if curl -fsSL "$url" -o coverage-base/coverage-summary.json; then
            echo "path=coverage-base/coverage-summary.json" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No baseline coverage found at $url; reporting without trends."
            echo "path=" >> "$GITHUB_OUTPUT"
          fi

      - name: Post coverage report
        uses: davelosert/vitest-coverage-report-action@5b6122e3a819a3be7b27fc961b7faafb3bf00e4d # v2.9.0
        with:
          json-summary-path: coverage/coverage-summary.json
          json-final-path: coverage/coverage-final.json
          # An empty path disables trend comparison.
          json-summary-compare-path: ${{ steps.baseline.outputs.path }}
          file-coverage-mode: changes
